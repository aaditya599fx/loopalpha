[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopalpha"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch==2.9.1", "numpy==2.4.2", "pandas==2.3.3", "scipy==1.17.1", "matplotlib==3.10.8", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
loopalpha = "loopalpha.experiment:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
